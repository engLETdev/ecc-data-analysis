name: Data Analysis Foundation

on:
  push:
    branches: [main, feat/data-analysis-foundation]
    paths:
      - 'examples/data-analysis/**'
      - '.github/workflows/data-analysis.yml'
  pull_request:
    paths:
      - 'examples/data-analysis/**'
      - '.github/workflows/data-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: examples/data-analysis
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install isolated package and development tools
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .

      - name: Lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Test with coverage
        run: python -m pytest --cov=data_analysis --cov-report=term-missing --cov-fail-under=80
