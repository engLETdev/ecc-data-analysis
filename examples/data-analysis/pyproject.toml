[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecc-data-analysis-foundation"
version = "0.1.0"
description = "Isolated data project foundation with source provenance and ECC conventions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]

[project.scripts]
data-analysis = "data_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "unit: isolated unit tests",
    "integration: local filesystem integration tests",
    "e2e: command-line tests in a separate process",
]

[tool.coverage.run]
source = ["data_analysis"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
